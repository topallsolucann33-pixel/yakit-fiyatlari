name: Borsa Verisi Güncelle (15 Dakikada Bir)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Veriyi çek
        run: node backend/fetch-finance-data.js

      - name: Sonucu commit'le
        run: |
          git config user.name "finance-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/data/finance.json
          git diff --cached --quiet || git commit -m "chore: borsa verisi güncellendi [otomatik]"
          git push
