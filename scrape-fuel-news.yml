name: Akaryakıt Haber Taraması (Günde 3 Kez)

on:
  schedule:
    # Türkiye saati UTC+3. GitHub Actions cron UTC kullanır, bu yüzden 3 saat geri alıyoruz.
    # 07:00 TR  -> 04:00 UTC  (sabah: gece yarısı yansıyan fiyatlar netleşmiş oluyor)
    - cron: "0 4 * * *"
    # 17:00 TR  -> 14:00 UTC  (rafineriler 16:00'da fiyat bildiriyor, hemen sonrası)
    - cron: "0 14 * * *"
    # 00:15 TR  -> 21:15 UTC (bir önceki gün) (gece yarısı zam/indirim resmen yürürlüğe girdiği an)
    - cron: "15 21 * * *"
  workflow_dispatch: {} # istersen manuel de tetikleyebilirsin

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Taramayı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node backend/scrape-fuel-news.js

      - name: Sonucu commit'le
        run: |
          git config user.name "fuel-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/data/expectations.json
          git diff --cached --quiet || git commit -m "chore: akaryakıt beklenti verisi güncellendi [otomatik]"
          git push
